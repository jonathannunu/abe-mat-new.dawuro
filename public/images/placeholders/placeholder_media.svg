<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <circle cx="600" cy="360" r="260" fill="#a855f7" fill-opacity="0.08" filter="blur(60px)" />
  
  <rect x="250" y="140" width="700" height="520" rx="32" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="2" />

  <!-- Sector Icon: Media / Broadcasting -->
  <g transform="translate(600, 290)">
    <circle cx="0" cy="0" r="64" fill="#9333ea" fill-opacity="0.2" stroke="#c084fc" stroke-width="2" />
    <rect x="-32" y="-22" width="64" height="44" rx="8" fill="none" stroke="#e9d5ff" stroke-width="4" />
    <polygon points="-6,-10 12,0 -6,10" fill="#c084fc" />
    <path d="M -16 -22 L -8 -34 M 16 -22 L 8 -34" stroke="#e9d5ff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Labels -->
  <text x="600" y="420" text-anchor="middle" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="4">COMMUNITY MEDIA &amp; CIVIC BROADCASTING</text>
  <text x="600" y="465" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800">የአዲስ ዳዉሮ ማህበረሰብ ሚዲያ ፕሮግራም</text>
  <text x="600" y="515" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">New Dawuro Media • Facebook, Telegram, YouTube &amp; TikTok</text>

  <!-- Tag / Status Badge -->
  <g transform="translate(600, 580)">
    <rect x="-170" y="-20" width="340" height="40" rx="20" fill="#311042" stroke="#c084fc" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" fill="#f3e8ff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Official Strategic Sector • Media Platform</text>
  </g>
</svg>
