<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <circle cx="600" cy="360" r="260" fill="#3b82f6" fill-opacity="0.08" filter="blur(60px)" />
  
  <rect x="250" y="140" width="700" height="520" rx="32" fill="url(#cardGrad)" stroke="#60a5fa" stroke-opacity="0.3" stroke-width="2" />

  <!-- Community Gathering / Unity Icon -->
  <g transform="translate(600, 290)">
    <circle cx="0" cy="0" r="64" fill="#1d4ed8" fill-opacity="0.2" stroke="#60a5fa" stroke-width="2" />
    <circle cx="0" cy="-14" r="16" fill="#93c5fd" />
    <circle cx="-30" cy="-6" r="12" fill="#bfdbfe" />
    <circle cx="30" cy="-6" r="12" fill="#bfdbfe" />
    <path d="M -24 32 C -24 16 -12 8 0 8 C 12 8 24 16 24 32 Z" fill="#3b82f6" />
    <path d="M -48 32 C -48 20 -38 14 -30 14 C -24 14 -18 18 -16 26 Z" fill="#2563eb" />
    <path d="M 48 32 C 48 20 38 14 30 14 C 24 14 18 18 16 26 Z" fill="#2563eb" />
  </g>

  <!-- Labels -->
  <text x="600" y="420" text-anchor="middle" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="4">COMMUNITY IMPACT &amp; CIVIC PARTICIPATION</text>
  <text x="600" y="465" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800">የዳውሮ ማህበረሰብ ልማትና ተሳትፎ</text>
  <text x="600" y="515" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">New Dawuro Foundation • Tarcha City &amp; Regional Clusters</text>

  <!-- Tag / Status Badge -->
  <g transform="translate(600, 580)">
    <rect x="-170" y="-20" width="340" height="40" rx="20" fill="#0f172a" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" fill="#dbeafe" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Civic Foundation Initiative • Tarcha, Ethiopia</text>
  </g>
</svg>
