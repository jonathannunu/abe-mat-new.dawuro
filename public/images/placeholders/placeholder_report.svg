<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.05" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <circle cx="600" cy="360" r="260" fill="#f59e0b" fill-opacity="0.06" filter="blur(60px)" />
  
  <rect x="250" y="140" width="700" height="520" rx="32" fill="url(#cardGrad)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2" />

  <!-- Document / Audit Report Icon -->
  <g transform="translate(600, 290)">
    <circle cx="0" cy="0" r="64" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2" />
    <rect x="-24" y="-32" width="48" height="64" rx="6" fill="#0f172a" stroke="#fde68a" stroke-width="3" />
    <line x1="-14" y1="-16" x2="14" y2="-16" stroke="#fde68a" stroke-width="3" stroke-linecap="round" />
    <line x1="-14" y1="-4" x2="14" y2="-4" stroke="#fde68a" stroke-width="3" stroke-linecap="round" />
    <line x1="-14" y1="8" x2="4" y2="8" stroke="#fde68a" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Labels -->
  <text x="600" y="420" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="4">OFFICIAL ANNUAL PERFORMANCE AUDIT REPORT</text>
  <text x="600" y="465" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800">ይፋዊ ዓመታዊ የሥራ እና የፋይናንስ ሪፖርት</text>
  <text x="600" y="515" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">New Dawuro Foundation • 100% Public Accountability</text>

  <!-- Tag / Status Badge -->
  <g transform="translate(600, 580)">
    <rect x="-170" y="-20" width="340" height="40" rx="20" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Audit Verified Document • PDF Available</text>
  </g>
</svg>
