<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <circle cx="600" cy="360" r="260" fill="#f59e0b" fill-opacity="0.08" filter="blur(60px)" />
  
  <rect x="250" y="140" width="700" height="520" rx="32" fill="url(#cardGrad)" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="2" />

  <!-- Sector Icon: Elderly Care / Community Support -->
  <g transform="translate(600, 290)">
    <circle cx="0" cy="0" r="64" fill="#d97706" fill-opacity="0.2" stroke="#fbbf24" stroke-width="2" />
    <circle cx="-16" cy="-14" r="14" fill="#fde68a" />
    <circle cx="18" cy="-10" r="12" fill="#fde68a" />
    <path d="M -34 32 C -34 16 -22 8 -16 8 C -10 8 2 16 2 32 Z" fill="#fbbf24" />
    <path d="M 4 32 C 4 18 14 12 18 12 C 24 12 32 18 32 32 Z" fill="#f59e0b" />
  </g>

  <!-- Labels -->
  <text x="600" y="420" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="4">ELDERLY &amp; VULNERABLE CITIZENS CARE</text>
  <text x="600" y="465" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800">የአረጋውያን እና አቅመ ደካሞች ድጋፍ ፕሮግራም</text>
  <text x="600" y="515" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">New Dawuro Foundation • Food Aid, Roof Repair &amp; Medical Checkups</text>

  <!-- Tag / Status Badge -->
  <g transform="translate(600, 580)">
    <rect x="-170" y="-20" width="340" height="40" rx="20" fill="#451a03" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Official Strategic Sector • Program Documentation</text>
  </g>
</svg>
