<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be185d" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.05" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <circle cx="600" cy="360" r="260" fill="#e11d48" fill-opacity="0.06" filter="blur(60px)" />
  
  <rect x="250" y="140" width="700" height="520" rx="32" fill="url(#cardGrad)" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="2" />

  <!-- Sector Icon: HeartPulse / Healthcare -->
  <g transform="translate(600, 290)">
    <circle cx="0" cy="0" r="64" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="2" />
    <path d="M -30 0 L -18 0 L -8 -24 L 6 24 L 16 -12 L 24 0 L 32 0" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Labels -->
  <text x="600" y="420" text-anchor="middle" fill="#fb7185" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="4">COMMUNITY HEALTHCARE &amp; HYGIENE INITIATIVE</text>
  <text x="600" y="465" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800">የማህበረሰብ ጤና እና የንፅህና ፕሮግራም</text>
  <text x="600" y="515" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">New Dawuro Foundation • Tarcha, Dawuro Zone, Ethiopia</text>

  <!-- Tag / Status Badge -->
  <g transform="translate(600, 580)">
    <rect x="-170" y="-20" width="340" height="40" rx="20" fill="#0f172a" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" fill="#fecdd3" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Official Strategic Sector • Program Documentation</text>
  </g>
</svg>
