<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.05" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <circle cx="600" cy="360" r="260" fill="#0ea5e9" fill-opacity="0.08" filter="blur(60px)" />
  
  <rect x="250" y="140" width="700" height="520" rx="32" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" />

  <!-- Sector Icon: Droplets / Clean Water -->
  <g transform="translate(600, 290)">
    <circle cx="0" cy="0" r="64" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" />
    <path d="M 0 -28 C 16 -12 24 6 24 18 C 24 31.25 13.25 42 0 42 C -13.25 42 -24 31.25 -24 18 C -24 6 -16 -12 0 -28 Z" fill="#38bdf8" fill-opacity="0.8" stroke="#7dd3fc" stroke-width="3" />
  </g>

  <!-- Labels -->
  <text x="600" y="420" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="4">CLEAN WATER &amp; SPRING PROTECTION INITIATIVE</text>
  <text x="600" y="465" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800">የንጹሕ ውኃና ምንጭ ማጎልበት ፕሮግራም</text>
  <text x="600" y="515" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">New Dawuro Foundation • Gena, Zaba Gazo &amp; Loma Woredas</text>

  <!-- Tag / Status Badge -->
  <g transform="translate(600, 580)">
    <rect x="-170" y="-20" width="340" height="40" rx="20" fill="#082f49" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Official Strategic Sector • Program Documentation</text>
  </g>
</svg>
