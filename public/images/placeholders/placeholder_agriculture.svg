<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <circle cx="600" cy="360" r="260" fill="#10b981" fill-opacity="0.08" filter="blur(60px)" />
  
  <rect x="250" y="140" width="700" height="520" rx="32" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.3" stroke-width="2" />

  <!-- Sector Icon: Sprout / Agriculture -->
  <g transform="translate(600, 290)">
    <circle cx="0" cy="0" r="64" fill="#059669" fill-opacity="0.2" stroke="#34d399" stroke-width="2" />
    <path d="M 0 35 C 0 10 5 -5 25 -15 C 25 15 15 25 0 35 Z" fill="#34d399" fill-opacity="0.8" stroke="#6ee7b7" stroke-width="3" />
    <path d="M 0 35 C 0 0 -10 -15 -30 -15 C -30 10 -15 25 0 35 Z" fill="#10b981" fill-opacity="0.9" stroke="#6ee7b7" stroke-width="3" />
    <path d="M 0 35 L 0 -25 C 0 -25 15 -35 25 -25 C 25 -15 15 0 0 0" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Labels -->
  <text x="600" y="420" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="4">SUSTAINABLE AGRICULTURE &amp; SEEDLING INITIATIVE</text>
  <text x="600" y="465" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800">ዘላቂ ግብርና እና የአፈር ጥበቃ ፕሮግራም</text>
  <text x="600" y="515" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">New Dawuro Foundation • Farmers &amp; School Gardens, Dawuro Zone</text>

  <!-- Tag / Status Badge -->
  <g transform="translate(600, 580)">
    <rect x="-170" y="-20" width="340" height="40" rx="20" fill="#064e3b" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Official Strategic Sector • Program Documentation</text>
  </g>
</svg>
